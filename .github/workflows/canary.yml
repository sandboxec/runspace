# Runs a few live checks weekly against a scratch repository to detect drift
# in the undocumented codespace connection protocol. It creates billable
# codespaces with a dedicated token.
name: canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - run: make canary
        env:
          RUNSPACE_TOKEN: ${{ secrets.RUNSPACE_CANARY_TOKEN }}
          RUNSPACE_LIVE_REPO: ${{ vars.RUNSPACE_CANARY_REPO }}
          # The live checks clean up with gh.
          GH_TOKEN: ${{ secrets.RUNSPACE_CANARY_TOKEN }}
